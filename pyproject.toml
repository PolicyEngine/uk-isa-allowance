[project]
name = "uk-isa-allowance"
version = "0.1.0"
description = "Who pays in the full UK ISA allowance, and who a £12,000 cash ISA limit would bind, from HMRC's ISA statistics."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [{ name = "PolicyEngine" }]
dependencies = [
  "pandas>=2.0",
  "odfpy>=1.4",
  # The policyengine.py release the UK Autumn Budget 2026 dashboard uses; its
  # [uk] extra exact-pins policyengine-uk (2.151.0), used for the salary floor.
  "policyengine[uk]==6.11.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
